<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RIK Web解析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=M+PLUS+2:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/vendor/chart-4.4.1.umd.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11"/><path d="M10 19V6"/><path d="M16 19v-5"/><path d="M3 21h18"/><path d="M15 8l2-3 3 1"/></svg>
      </span>
      <div class="brand-text">
        <h1>RIK Web解析</h1>
        <span class="brand-sub">ユニマットリック マーケティング</span>
      </div>
      <span id="demo-badge" class="badge badge-warn" hidden>デモデータ</span>
    </div>
    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="集計期間">
        <button data-range="7d" role="radio">7日</button>
        <button data-range="28d" role="radio">28日</button>
        <button data-range="90d" role="radio">90日</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="比較対象">
        <button data-compare="prev" role="radio">直前と比較</button>
        <button data-compare="yoy" role="radio">前年と比較</button>
      </div>
      <button id="refresh" class="btn" title="APIから最新データを取り直します">最新に更新</button>
      <span id="user" class="muted small"></span>
      <a id="logout" class="btn" href="/cdn-cgi/access/logout" title="ログイン状態を解除します。次に開くときはメールのコードが必要です">ログオフ</a>
    </div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="表示するサイト"></nav>
  </header>

  <main id="view" class="view" aria-live="polite">
    <p class="muted">読み込み中…</p>
  </main>

  <footer class="foot muted small">
    集計期間は昨日までの完了日です。「直前と比較」は同じ日数のすぐ前の期間、「前年と比較」は同じ日付の1年前と比べます。「今日（速報）」は途中値です。
  </footer>

  <button id="ask-open" class="ask-fab" type="button" aria-controls="ask" aria-expanded="false" title="画面の見方や気になるデータについて、AIに質問できます">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.6 9.5a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17h.01"/></svg>
    <span>AIに質問</span>
  </button>
  <aside id="ask" class="ask" role="dialog" aria-label="AIに質問" hidden>
    <header class="ask-head">
      <div>
        <h2>AIに質問</h2>
        <p id="ask-scope" class="muted small"></p>
      </div>
      <button id="ask-reset" class="btn" type="button" title="この画面での会話を消して、最初から質問します">新しい会話</button>
      <button id="ask-close" class="ask-x" type="button" aria-label="閉じる">×</button>
    </header>
    <div id="ask-log" class="ask-log" aria-live="polite"></div>
    <form id="ask-form" class="ask-form">
      <textarea id="ask-input" rows="2" maxlength="1000" placeholder="例：先週より問い合わせが減ったのはなぜ？（Enterで送信、Shift+Enterで改行）"></textarea>
      <button id="ask-send" class="btn btn-primary" type="submit">送信</button>
    </form>
    <p class="ask-note muted small">表示中のサイト・期間のデータと診断をもとにAIが答えます。会話は保存されず、画面を閉じると消えます。</p>
  </aside>

  <script src="/app.js" type="module"></script>
</body>
</html>
