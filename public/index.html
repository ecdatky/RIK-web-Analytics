<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RIK Web解析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/vendor/chart-4.4.1.umd.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11"/><path d="M10 19V6"/><path d="M16 19v-5"/><path d="M3 21h18"/><path d="M15 8l2-3 3 1"/></svg>
      </span>
      <div class="brand-text">
        <h1>RIK Web解析</h1>
        <span class="brand-sub">ユニマットリック マーケティング</span>
      </div>
      <span id="demo-badge" class="badge badge-warn" hidden>デモデータ</span>
    </div>
    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="集計期間">
        <button data-range="7d" role="radio">7日</button>
        <button data-range="28d" role="radio">28日</button>
        <button data-range="90d" role="radio">90日</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="比較対象">
        <button data-compare="prev" role="radio">前期間比</button>
        <button data-compare="yoy" role="radio">前年同期比</button>
      </div>
      <button id="refresh" class="btn" title="APIから最新データを取り直します">最新に更新</button>
      <span id="user" class="muted small"></span>
    </div>
  </header>

  <nav id="tabs" class="tabs" role="tablist" aria-label="サイト"></nav>

  <main id="view" class="view" aria-live="polite">
    <p class="muted">読み込み中…</p>
  </main>

  <footer class="foot muted small">
    集計期間は昨日までの完了日です。前期間は同じ日数の直前期間、前年同期は同じ日付の1年前です。「今日（速報）」は途中値です。
  </footer>

  <script src="/app.js" type="module"></script>
</body>
</html>
